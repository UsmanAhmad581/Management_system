# VSIMS Application Configuration

[server]
# Server host and port. Set host to 0.0.0.0 to accept connections from any interface.
# Set port to 0 to auto-detect an available port
host = 127.0.0.1
port = 8000
auto_open_browser = true

[database]
# Database file path (relative to APP_DIR)
db_filename = vsims.db
# Connection timeout in seconds
connection_timeout = 10
# Enable WAL (Write-Ahead Logging) mode for better concurrency
wal_mode = true
# Busy timeout in milliseconds (how long SQLite waits if database is locked)
busy_timeout = 5000

[backup]
# Enable automatic database backups
enabled = true
# Backup directory (relative to APP_DIR)
backup_dir = backups
# Number of backup copies to retain
max_backups = 5

[logging]
# Log file name (relative to APP_DIR)
log_filename = vsims.log
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO
# Maximum log file size in bytes before rotation
max_file_size = 2000000
# Number of backup log files to keep
backup_count = 3

[validation]
# Maximum length for text fields (customer name, product name, etc.)
max_text_length = 255
# Maximum length for descriptions
max_description_length = 1000
# Minimum acceptable values for prices and quantities
min_price = 0.00
min_quantity = 0
# Maximum acceptable values
max_price = 999999.99
max_quantity = 999999

[security]
# Enable input sanitization
sanitize_input = true
# List of prohibited characters in entity names (comma-separated)
prohibited_chars = <>:"/\|?*
